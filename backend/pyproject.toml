[project]
name = "idreader"
version = "0.1.0"
description = "Lecture automatique de pièces d'identité, 100 % local"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "typer>=0.13",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
]

[project.scripts]
idreader = "idreader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests qui lancent de vrais processus"]
filterwarnings = [
    "error",
    # Starlette 1.x recommande httpx2 pour TestClient ; httpx reste fonctionnel (DECISIONS.md)
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # texte en français (apostrophes, guillemets)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S108"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src", "../scripts"]

# CLAUDE.md : mypy --strict sur pipeline/ et engines/
[[tool.mypy.overrides]]
module = ["idreader.engines.*", "idreader.pipeline.*"]
strict = true
