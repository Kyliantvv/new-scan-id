[[model]]
name = "font-roboto"
# Police Roboto 3.008 (variable wdth/wght), google/fonts au dernier commit sous apache/
# (METADATA.pb : license "APACHE2" ; passée en OFL au commit suivant, non utilisé ici).
# Sert uniquement à rendre la zone visuelle des documents synthétiques (accents, tests).
url = "https://raw.githubusercontent.com/google/fonts/4dd6e2b3f7e872f6ecc456a6eee31e39a02d06d8/apache/roboto/Roboto%5Bwdth%2Cwght%5D.ttf"
