# Ancienne carte nationale d'identité française (format ID-2, avant 2021), recto et verso.
id: FRA_id_card_1995
country: FRA
type: id_card
version: "1995"
description: Ancienne CNI plastifiée (ID-2, 105 × 74 mm), MRZ « FRA-ID » de deux lignes de 36 caractères au recto.
recognition:
  physical_format: ID2
  aspect: [1.38, 1.45]
  mrz_format: FRA-ID
  photo_side: left
  notes: >-
    Recto : bandeau bleu « RÉPUBLIQUE FRANÇAISE », « CARTE NATIONALE D'IDENTITÉ n° » et
    « Nationalité Française », photo à gauche, MRZ en bas. Verso : adresse, validité, autorité.
date_format: "DD MM YYYY"
rules:
  numbered_labels: false
  given_names_separator: ","
  usage_name_markers: ["ép.", "épouse", "epse", "usage", "vve", "veuve"]
  mrz_priority: true
  notes:
    - "Libellés avec deux-points : « Nom : », « Prénom(s) : », « Né(e) le : », « à : », « Taille : »."
    - "Le nom d'usage (« Épouse : ») peut figurer sous le nom ; il ne va jamais dans les prénoms."
    - "La MRZ FRA-ID mêle nom (ligne 1) et prénoms (ligne 2, avant la date de naissance)."
