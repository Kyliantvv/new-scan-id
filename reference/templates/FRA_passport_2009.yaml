  usage_name_markers: ["ép.", "épouse", "epse", "usage", "vve", "veuve"]
  mrz_priority: true
  notes:
    - "« Type » (P), « Code du pays » (FRA) et « Passeport n° » ne sont pas des noms."
    - "Nom d'usage : « DUPONT ép. MARTIN » sur la ligne du nom ; jamais dans les prénoms."
