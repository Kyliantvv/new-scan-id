# Carte nationale d'identité française au format carte (depuis août 2021), recto et verso.
id: FRA_id_card_2021
country: FRA
type: id_card
version: "2021"
description: CNI française au format carte bancaire (depuis 2021), recto avec photo, verso avec MRZ TD1.
recognition:
  physical_format: ID1
  aspect: [1.55, 1.62]
  mrz_format: TD1
  photo_side: left
  notes: >-
    Recto : photo à gauche, « RÉPUBLIQUE FRANÇAISE / CARTE NATIONALE D'IDENTITÉ / IDENTITY CARD »,
    drapeau européen en haut à droite. Verso : 2D-Doc, puce, MRZ TD1 de trois lignes.
date_format: "DD MM YYYY"
rules:
  numbered_labels: false
  given_names_separator: ","
  usage_name_markers: ["ép.", "épouse", "epse", "usage", "vve", "veuve"]
  mrz_priority: true
  notes:
    - "Prénoms en casse mixte et séparés par des virgules (« Maëlys-Gaëlle, Marie »)."
    - "Le « N° du document » du recto est celui de la MRZ ; le petit numéro en bas à droite n'est pas un champ."
