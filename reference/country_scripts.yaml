# Langues à passer à l'OCR de la zone visuelle selon le pays émetteur (code MRZ).
# Graine pour les pays les plus probables ; à compléter selon les statistiques réelles.
# - vision : préfixes de langues pour Apple Vision (croisés au démarrage avec `idvision languages`)
# - ppocr  : groupe de modèle PP-OCR (latin|cjk|cyrillic|arabic|greek|korean|thai|devanagari)
# Toujours ajouter en, fr, es (libellés des passeports) côté Vision.
# Pays absent de la liste : vision [en, fr, es], ppocr latin, et on s'appuie surtout sur la MRZ.

FRA: {vision: [fr], ppocr: [latin]}
BEL: {vision: [fr, nl, de], ppocr: [latin]}
CHE: {vision: [de, fr, it], ppocr: [latin]}
LUX: {vision: [fr, de], ppocr: [latin]}
D:   {vision: [de], ppocr: [latin]}
AUT: {vision: [de], ppocr: [latin]}
ESP: {vision: [es], ppocr: [latin]}
PRT: {vision: [pt], ppocr: [latin]}
